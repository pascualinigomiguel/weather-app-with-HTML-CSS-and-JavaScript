<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Weather — See the day differently</title>
  <desc id="desc">A glassmorphic weather app poster showing a glowing sun, cloud, rain, and weather details.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071d45"/><stop offset=".48" stop-color="#156a9c"/><stop offset="1" stop-color="#76d5d0"/></linearGradient>
    <radialGradient id="sun"><stop stop-color="#fff8bc"/><stop offset=".38" stop-color="#ffe27a"/><stop offset="1" stop-color="#ffad4f" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".28"/><stop offset="1" stop-color="#ffffff" stop-opacity=".08"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9ffff"/><stop offset="1" stop-color="#78e7ed"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#03152e" flood-opacity=".38"/></filter>
    <pattern id="grain" width="80" height="80" patternUnits="userSpaceOnUse"><circle cx="12" cy="23" r="1" fill="#fff" opacity=".12"/><circle cx="58" cy="61" r="1" fill="#fff" opacity=".1"/></pattern>
  </defs>
  <rect width="1200" height="1600" fill="url(#sky)"/>
  <circle cx="965" cy="260" r="260" fill="url(#sun)" filter="url(#blur)"/>
  <circle cx="965" cy="260" r="120" fill="url(#sun)"/>
  <g fill="#d8fbff" opacity=".7"><circle cx="115" cy="210" r="3"/><circle cx="240" cy="370" r="2"/><circle cx="1040" cy="520" r="3"/><circle cx="155" cy="720" r="2"/></g>
  <path d="M0 1100c210-130 390-120 610-25 205 89 360 102 590-25v550H0z" fill="#052d5a" opacity=".6"/>
  <path d="M0 1260c250-120 430-68 630 13 210 85 355 70 570-34v361H0z" fill="#031b43" opacity=".72"/>

  <!-- heading -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="205" fill="#dfffff" font-size="27" letter-spacing="12" font-weight="700">FORECAST YOUR DAY</text>
    <text x="600" y="385" fill="#ffffff" font-size="142" letter-spacing="7" font-weight="900" filter="url(#shadow)">WEATHER</text>
    <path d="M335 430h530" stroke="#aef8f2" stroke-width="3" opacity=".8"/>
    <text x="600" y="495" fill="#d9ffff" font-size="29" letter-spacing="6">FEEL THE MOMENT</text>
  </g>

  <!-- glass weather card -->
  <g filter="url(#shadow)">
    <rect x="190" y="590" width="820" height="520" rx="44" fill="url(#glass)" stroke="#c6ffff" stroke-opacity=".5" stroke-width="3"/>
    <path d="M235 665h730" stroke="#fff" stroke-opacity=".23" stroke-width="2"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="250" y="645" fill="#dfffff" font-size="25" letter-spacing="4">CURRENT CONDITIONS</text>
      <text x="250" y="765" fill="#ffffff" font-size="112" font-weight="300">20°</text>
      <text x="257" y="820" fill="#baf5fa" font-size="32" font-weight="700">LONDON</text>
      <text x="257" y="870" fill="#eaffff" font-size="25">Clear skies · Feels like 19°</text>
      <text x="257" y="940" fill="#a7eaf0" font-size="22">HIGH 23°     LOW 15°</text>
      <text x="257" y="1012" fill="#eaffff" font-size="21">Humidity 52%  ·  Wind 12 km/h</text>
    </g>
    <!-- cloud icon -->
    <g transform="translate(735 825)">
      <circle cx="0" cy="-60" r="84" fill="url(#sun)" opacity=".9"/>
      <path d="M-125 55c0-48 39-86 87-86 20 0 39 7 54 18 18-43 60-73 109-73 65 0 118 53 118 118 47 0 85 38 85 85H-125z" fill="#eaffff" fill-opacity=".78"/>
      <path d="M-64 132l-24 67M20 132l-24 67M103 132l-24 67" stroke="#9cf1ef" stroke-width="12" stroke-linecap="round" opacity=".8"/>
    </g>
  </g>

  <!-- search callout -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="1230" fill="#ffffff" font-size="39" font-weight="700">YOUR SKY. YOUR CITY. YOUR MOMENT.</text>
    <text x="600" y="1285" fill="#bdf9f5" font-size="24" letter-spacing="3">SEARCH THE WORLD IN REAL TIME</text>
    <rect x="340" y="1360" width="520" height="76" rx="38" fill="#d6ffff" fill-opacity=".92"/>
    <text x="600" y="1409" fill="#073b68" font-size="25" letter-spacing="4" font-weight="700">HTML · CSS · JAVASCRIPT</text>
    <text x="600" y="1515" fill="#c8ffff" font-size="19" letter-spacing="5" opacity=".85">A CLEARER VIEW OF EVERY DAY</text>
  </g>
  <rect width="1200" height="1600" fill="url(#grain)" opacity=".45"/>
  <rect x="26" y="26" width="1148" height="1548" rx="8" fill="none" stroke="#bffffc" stroke-width="2" opacity=".55"/>
</svg>
